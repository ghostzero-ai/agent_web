<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>AI Study Companion</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        background: #111827;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        padding: 1.5rem;
        border: 1px solid #374151;
        border-radius: 1rem;
        background: #1f2937;
      }
      code {
        overflow-wrap: anywhere;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>移动端尚未连接服务端</h1>
      <p>
        这是 Capacitor 的离线兜底页。Debug APK 需要在同步前设置
        <code>CAPACITOR_BUILD_PROFILE=spike</code> 和 HTTPS
        <code>CAPACITOR_SERVER_URL</code>。
      </p>
      <p>请确认电脑端 Docker 与 Tailscale 正在运行后重新同步并构建。</p>
    </main>
  </body>
</html>
